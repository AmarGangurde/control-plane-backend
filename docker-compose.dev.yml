services:
  postgres:
    image: postgres:16-alpine
    container_name: wrexer-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: wrexer
      POSTGRES_PASSWORD: wrexer_secret
      POSTGRES_DB: wrexer
    volumes:
      - ./pgdata-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrexer"]
      interval: 5s
      timeout: 5s
      retries: 5
