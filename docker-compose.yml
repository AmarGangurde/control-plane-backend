services:
  control-plane:
    image: ghcr.io/amargangurde/control-plane-backend:latest
    container_name: backend-app
    environment:
      - NODE_ENV=production
    network_mode: host
    volumes:
      - ./data:/app/data
      - /home/ubuntu/.kube/config:/home/node/.kube/config:ro
      - /home/ubuntu/.kube/config:/app/k3s.yaml:ro
      - ./.env:/app/.env:ro
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
