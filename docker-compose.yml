

services:
  postgres:
    image: postgres:16-alpine
    container_name: wrexer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wrexer
      POSTGRES_PASSWORD: wrexer_secret
      POSTGRES_DB: wrexer
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrexer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/amargangurde/control-plane-backend:latest
    container_name: wrexer-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://wrexer:wrexer_secret@postgres:5432/wrexer
    volumes:
      - /etc/rancher/k3s/k3s.yaml:/app/k3s.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
